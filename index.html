<head>

    <link rel="stylesheet" href="style.css">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <div class="container">
        <video class="back-video" loop autoplay muted plays-inline src="videos/galaxy.mp4" type="video/mp4"></video>
        <header>
            <div class="left">
                <a href="index.html"><img src="images/profile2-removebg-preview.png" alt="logo"></a>
            </div>

            <ul class="nav-menu">
                <li><a href="about.html" target="_blank">About</a></li>
                <li><a href="skills.html" target="_blank">Skills</a></li>
                <li><a href="projects.html" target="_blank">Projects</a></li>
                <li class="mobile-social-links">
                    <a href="https://github.com/vishalkammari" target="_blank"><i class='bx bxl-github'></i> GitHub</a>
                </li>
                <li class="mobile-social-links">
                    <a href="https://www.linkedin.com/in/vishal-kammari/" target="_blank"><i class='bx bxl-linkedin'></i> LinkedIn</a>
                </li>
                <li class="mobile-social-links">
                    <a href="https://x.com/vishcodes" target="_blank"><i class='bx bxl-twitter'></i> Twitter</a>
                </li>
            </ul>

            <div class="hamburger" style="margin-right: 20px;padding-right: 10px;">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>

            <div class="box-icons">
                <a href="https://github.com/vishalkammari" target="_blank"><i class='bx bxl-github' ></i></a>
                <a href="https://www.linkedin.com/in/vishal-kammari/" target="_blank"><i class='bx bxl-linkedin'></i></a>
                <a href="https://x.com/vishcodes" target="_blank"><i class='bx bxl-twitter'></i></a>
            </div>
        </header>

        <section class="hero">
            <div class="hero-info">
                <!-- Place this inside your HTML where you want the indicator -->
                <div class="live-indicator">
                    <span class="dot"></span>
                    <span>Open for Projects</span>
                </div>

                <h1><span>Hi I'm VISHAL</span></h1>
                <h2>I'm a <span class="auto-type gradiant"></span></h2>
                <p>I'm a <span class="gradiant" style="font-weight: 600;">full stack developer</span> with experience
                    in crafting beautiful websites </p>
                <a href="mailto:vishalkammari2102@gmail.com" target="_blank">
                    <button>Contact Me</button>
                </a>
            </div>
            <div class="hero-image">
                <img src="images/profile2-removebg-preview.png" alt="Vishal Kammari">
            </div>
            <br><br><br><br><b></b>
        </section>

        <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
        <script>
            var typed = new Typed(".auto-type", {
                strings: ["MERN Stack Developer", "Competitive Programmer", "Open Source Contributor"],
                typeSpeed: 50,
                backSpeed: 50,
                loop: true
            });
            
            // Mobile menu functionality
            const hamburger = document.querySelector(".hamburger");
            const navMenu = document.querySelector(".nav-menu");
            
            hamburger.addEventListener("click", () => {
                hamburger.classList.toggle("active");
                navMenu.classList.toggle("active");
            });
            
            // Close menu when clicking on a link
            document.querySelectorAll(".nav-menu a").forEach(n => n.addEventListener("click", () => {
                hamburger.classList.remove("active");
                navMenu.classList.remove("active");
            }));
        </script>
    </div>
</body>

</html>
